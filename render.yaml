services:
  - type: web
    name: ytdl-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # Generated by Render so Flask sessions are secure in production.
      - key: SECRET_KEY
        generateValue: true
      # Database connection. Link a managed Postgres instance here, or leave
      # unset to fall back to local SQLite (resets on every deploy/restart).
      - key: DATABASE_URL
        sync: false
      # Optional: Netscape-format cookies.txt path to bypass YouTube's
      # "confirm you're not a bot" checks from datacenter IPs.
      - key: YTDLP_COOKIES_FILE
        sync: false
      # Optional: webhook fired on new signups.
      - key: WEBHOOK_URL
        sync: false
